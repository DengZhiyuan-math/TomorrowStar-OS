[build-system]
requires = []
build-backend = "_career_evidence_build"
backend-path = ["."]

[project]
name = "career-evidence-graph"
version = "0.1.0"
description = "Career Evidence Graph core hypothesis validation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic==2.13.4",
]

[project.scripts]
career-evidence = "career_evidence_graph.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-m", "not live_model"]
markers = [
  "live: opt-in tests that may invoke an external model",
  "live_model: opt-in test that invokes an authenticated model runtime",
  "phase03_original_probe: executable original Phase 3 acceptance probe",
  "phase03_gap_probe: executable Phase 3 review or verification gap probe",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".planning", "references/upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
